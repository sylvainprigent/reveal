[project]
name = "reveal"
version = "0.1.0"
description = "Reveal backend"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Your Name" }
]

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "typer>=0.27.0",
    "rich>=15.0.0",
    "duckdb>=1.5.5",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
]

[project.scripts]
reveal = "reveal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reveal"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "pytest>=9.1.1",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.2",
]
